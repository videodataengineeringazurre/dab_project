name: CI Workflow

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'main'
jobs:
  ci_job:
    name: CI Job
    runs-on: ubuntu-latest
    steps:
      - name: Chekout Code
        uses: actions/checkout@v4
        
      - name: Set up python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies + pytest-html
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pyspark.txt
      - name: Install pytest and run coverage and html report
        run: |
          pytest \
            --disable-warnings \
            --cov=./src \
            --cov-report=html
      - name: upload html report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
