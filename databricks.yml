# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 0195b3c5-900d-441d-9d8e-abe0c2424de1

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.

variables:
  catalog:
    default: "citibike_dev"
  dev_flag:
    default: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-3959477662264699.19.azuredatabricks.net
    presets:
      artifacts_dynamic_version: true

  test:
    mode: production
    variables:
      catalog:
        default: "citibike_test"
      dev_flag:
        default: false
    workspace:
      host: https://adb-1091851834659423.3.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/videodataengineeringazurre@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: videodataengineeringazurre@outlook.com
        level: CAN_MANAGE

  prod:
    mode: production
    variables:
      catalog:
        default: "citibike_prod"
      dev_flag:
        default: false
    workspace:
      host: https://adb-1936680208400845.5.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/videodataengineeringazurre@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: videodataengineeringazurre@outlook.com
        level: CAN_MANAGE
